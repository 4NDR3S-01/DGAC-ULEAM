<VirtualHost *:80>
    ServerName dgacweb.uleam.edu.ec
    Redirect permanent / https://dgacweb.uleam.edu.ec/
</VirtualHost>
<VirtualHost *:443>
    ServerName dgacweb.uleam.edu.ec
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ensayo.crt
    SSLCertificateKeyFile /etc/ssl/private/ensayo.key
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    ServerSignature Off
</VirtualHost>
