<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
  <!-- Textura "plano de procesos" (fondo del carrusel por capas). Trazos blancos; la opacidad se
       controla desde css/carrusel.css. Se repite en mosaico sin cortes. -->
  <defs>
    <pattern id="fina" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke-width=".5" opacity=".35"/>
    </pattern>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#fff" stroke="none"/>
    </marker>
  </defs>

  <!-- Cuadrícula técnica -->
  <rect width="560" height="560" fill="url(#fina)" stroke="none"/>
  <path d="M0 140H560M0 280H560M0 420H560M140 0V560M280 0V560M420 0V560" stroke-width=".9" opacity=".5"/>

  <!-- Diagrama de flujo: inicio → proceso → decisión → proceso / documento -->
  <g stroke-width="1.6">
    <rect x="36" y="44" width="104" height="40" rx="20"/>
    <path d="M88 84V122" marker-end="url(#flecha)"/>
    <rect x="30" y="124" width="116" height="52" rx="4"/>
    <path d="M88 176V212" marker-end="url(#flecha)"/>
    <path d="M88 214 132 254 88 294 44 254Z"/>
    <path d="M132 254H196" marker-end="url(#flecha)"/>
    <rect x="198" y="230" width="112" height="48" rx="4"/>
    <path d="M88 294V334" marker-end="url(#flecha)"/>
    <!-- Documento -->
    <path d="M36 336H140V384C120 374 104 394 88 388S56 374 36 386Z"/>
    <path d="M52 352H124M52 366H108" stroke-width="1" opacity=".7"/>
  </g>

  <!-- Ciclo PHVA (mejora continua) -->
  <g stroke-width="1.6">
    <circle cx="430" cy="118" r="70"/>
    <path d="M430 48V188M360 118H500" stroke-width="1"/>
    <path d="M478 66a70 70 0 0 1 22 40" marker-end="url(#flecha)"/>
    <path d="M382 170a70 70 0 0 1-22-40" marker-end="url(#flecha)"/>
  </g>
  <g fill="#fff" stroke="none" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="700" opacity=".9">
    <text x="389" y="104">P</text><text x="451" y="104">H</text>
    <text x="451" y="150">V</text><text x="389" y="150">A</text>
  </g>

  <!-- Cotas, como en un plano -->
  <g stroke-width="1" opacity=".8">
    <path d="M330 330H530M330 322V338M530 322V338"/>
    <path d="M520 350V520M512 350H528M512 520H528"/>
  </g>
  <g fill="#fff" stroke="none" font-family="Montserrat, Arial, sans-serif" font-size="13" opacity=".8">
    <text x="410" y="322">2.40</text>
    <text x="500" y="440" transform="rotate(-90 500 440)">1.75</text>
  </g>

  <!-- Indicador: barras y tendencia -->
  <g stroke-width="1.6">
    <path d="M330 520V380M330 520H490" stroke-width="1"/>
    <rect x="346" y="470" width="22" height="50"/>
    <rect x="384" y="444" width="22" height="76"/>
    <rect x="422" y="420" width="22" height="100"/>
    <rect x="460" y="398" width="22" height="122"/>
    <path d="M350 452 392 426 430 404 474 380" stroke-dasharray="4 5"/>
  </g>

  <!-- Lista de verificación -->
  <g stroke-width="1.4">
    <rect x="200" y="420" width="96" height="112" rx="4"/>
    <path d="M214 446l6 6 10-12M214 474l6 6 10-12M214 502l6 6 10-12"/>
    <path d="M240 446H284M240 474H284M240 502H272" opacity=".7"/>
  </g>
</svg>
